zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: bd327ca2dab24c4aa6ba757655aa052f
    name: Templates/Applications
  templates:
  - uuid: 483df00fdd294bffb2628db7db98c963
    template: Kerio Connect by Script
    name: Kerio Connect by Script
    vendor:
      name: itforprof.com
      version: 1.3.0
    description: 'Шаблоны Zabbix 7 для мониторинга Kerio Connect через JSON-RPC Admin API.


      Шаблон следит за почтовым сервером Kerio Connect через его JSON-RPC Admin API.

      API вызывает сам сервер или прокси Zabbix, агент не нужен.


      Процессор, память, swap и метрики по доменам шаблон не собирает:

      нужные для них методы API роли Auditor недоступны.

      Метрики ОС даёт шаблон Windows или Linux, привязанный к тому же хосту.


      Author:  Konstantin Tyutyunnik / Константин Тютюнник

      Site:    https://itforprof.com

      Repo:    https://github.com/IT-for-Prof/zabbix-kerio-connect

      License: MIT (c) 2026 Konstantin Tyutyunnik'
    groups:
    - name: Templates/Applications
    macros:
    - macro: '{$KERIO.API.SCHEME}'
      value: https
    - macro: '{$KERIO.API.HOST}'
      value: <SET KERIO HOST>
    - macro: '{$KERIO.API.PORT}'
      value: '4040'
    - macro: '{$KERIO.API.USERNAME}'
      value: admin
    - macro: '{$KERIO.API.PASSWORD}'
      value: ''
      type: SECRET_TEXT
    - macro: '{$KERIO.QUEUE.WARN}'
      value: '100'
    - macro: '{$KERIO.DISK.HIGH}'
      value: '95'
      description: Критический порог занятого места на диске, %.
    - macro: '{$KERIO.DISK.DISASTER}'
      value: '99'
      description: Порог Disaster для занятого места на диске, %. Выше него Kerio перестаёт принимать почту.
    - macro: '{$KERIO.SMTP.AUTH.WARN}'
      value: '1'
      description: 'Порог для ошибок входа SMTP: сколько их в секунду в среднем за 5 минут. Одна в секунду без перерыва — это 300 попыток за 5 минут.'
    - macro: '{$KERIO.QUEUE.STUCK.AGE}'
      value: 1h
      description: Возраст, после которого письмо с временной ошибкой (статус 4.x.x) считается застрявшим.
    - macro: '{$KERIO.QUEUE.AGE.HIGH}'
      value: 24h
      description: Возраст самого старого письма в очереди, после которого поднимается предупреждение. Оно закрывается, когда Kerio возвращает письмо отправителю (Smtp.get bounceInterval).
    - macro: '{$KERIO.LOG.LINES}'
      value: '5000'
      description: Сколько последних строк журнала mail проверка релея читает раз в час. Их должно хватать на час журнала.
    - macro: '{$KERIO.RELAY.UNAUTH.ALLOW}'
      value: ''
      description: 'Регулярное выражение для частных адресов Sender-Host, которым разрешён релей без авторизации: только конкретные внутренние хосты, адрес NAT — никогда. Пусто — никому.'
    tags:
    - tag: class
      value: application
    - tag: target
      value: kerio-connect
    items:
    - uuid: b94f11060a9e404eb1429357b7ada235
      name: 'Kerio Connect: данные API'
      type: SCRIPT
      key: kerio.api.master
      delay: 1m
      history: 1h
      trends: '0'
      timeout: 30s
      value_type: TEXT
      description: 'Главный элемент данных. Вызывает JSON-RPC API Kerio Connect и возвращает JSON

        с четырьмя ключами верхнего уровня: statistics, services, license, server.

        Остальные элементы берут из него значения через JSONPath. Формат описан

        в docs/api_fields.md.

        '
      parameters:
      - name: host
        value: '{$KERIO.API.HOST}'
      - name: port
        value: '{$KERIO.API.PORT}'
      - name: scheme
        value: '{$KERIO.API.SCHEME}'
      - name: username
        value: '{$KERIO.API.USERNAME}'
      - name: password
        value: '{$KERIO.API.PASSWORD}'
      params: |
        // kerio_api.js - shared Kerio JSON-RPC client (Duktape engine). tools/sync_template_js.py
        // prepends it to every collector, because a Zabbix Script item cannot import code.
        var params = JSON.parse(value);
        var baseUrl = params.scheme + '://' + params.host + ':' + params.port + '/admin/api/jsonrpc/';
        var reqId = 0;
        var token = null;
        var cookie = null;

        function apiCall(method, callParams) {
            reqId++;
            var body = { jsonrpc: '2.0', id: reqId, method: method };
            if (callParams) body.params = callParams;
            if (token) body.token = token;

            var http = new HttpRequest();
            http.addHeader('Content-Type: application/json');
            http.addHeader('Accept: application/json');
            if (cookie) http.addHeader('Cookie: ' + cookie);
            if (token) http.addHeader('X-Token: ' + token);

            var resp = http.post(baseUrl, JSON.stringify(body));
            var status = http.getStatus();
            if (status < 200 || status >= 300) throw 'HTTP ' + status + ' on ' + method;

            var result = JSON.parse(resp);
            if (result.error) throw method + ' error: ' + result.error.message;
            if (method === 'Session.login') {
                var headers = http.getHeaders ? http.getHeaders() : {};
                var sc = headers['set-cookie'] || headers['Set-Cookie'] || '';
                if (sc) cookie = sc.split(';')[0];
            }
            return result.result;
        }

        // Several methods in one HTTP request: Kerio closes the connection after every
        // response, so each request pays the full connection setup.
        function batchCall(commands) {
            var results = apiCall('Batch.run', { commandList: commands });
            var out = [];
            for (var i = 0; i < commands.length; i++) {
                var r = results[i] || {};
                if (r.error) throw commands[i].method + ' error: ' + r.error.message;
                out.push(r.result || {});
            }
            return out;
        }

        function withSession(appName, body) {
            token = apiCall('Session.login', {
                userName: params.username,
                password: params.password,
                application: { name: appName, vendor: 'Zabbix', version: '7.0' }
            }).token;
            try {
                return body();
            } finally {
                try { apiCall('Session.logout'); } catch (e) {}
            }
        }

        // 'YYYY-MM-DD HH:MM[:SS]' or 'DD/Mon/YYYY HH:MM:SS' in server local time -> unix seconds.
        var MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        function serverTime(text, offsetMinutes) {
            var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::(\d{2}))?/.exec(text);
            var utc;
            if (m) utc = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
            else {
                m = /^(\d{2})\/(\w{3})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})/.exec(text);
                if (!m || !(m[2] in MONTHS)) return null;
                utc = Date.UTC(+m[3], MONTHS[m[2]], +m[1], +m[4], +m[5], +m[6]);
            }
            return utc / 1000 - offsetMinutes * 60;
        }

        // Zabbix time suffix ('90', '30m', '4h', '1d', '1w') -> seconds.
        function seconds(text) {
            var m = /^\s*(\d+)\s*([smhdw]?)\s*$/.exec(String(text));
            if (!m) throw 'bad time value: ' + text;
            return +m[1] * { '': 1, s: 1, m: 60, h: 3600, d: 86400, w: 604800 }[m[2]];
        }

        return withSession('Zabbix Monitoring', function () {
            var r = batchCall([
                { method: 'Statistics.get', params: {} },
                { method: 'Services.get', params: {} },
                { method: 'ProductRegistration.getFullStatus', params: {} },
                { method: 'Server.getVersion', params: {} }
            ]);
            return JSON.stringify({
                statistics: r[0].statistics || {},
                services: r[1].services || [],
                license: r[2].status || {},
                server: r[3] || {}
            });
        });
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: ae548683018b4d57ba5218f36225a1fd
        expression: nodata(/Kerio Connect by Script/kerio.api.master,5m)=1
        name: 'Kerio Connect: данные API не собираются'
        event_name: 'Kerio Connect на {HOST.NAME}: данные API не собираются (нет данных 5 мин)'
        priority: AVERAGE
        tags:
        - tag: scope
          value: availability
        manual_close: 'YES'
        description: Главный элемент данных ничего не получает 5 минут. Проверьте сетевой доступ к порту Kerio 4040 и учётные данные API.
    - uuid: b3c9958971e84b3cb7b0686b99284db9
      name: 'Kerio Connect: занято на диске'
      type: DEPENDENT
      key: kerio.disk.used
      delay: '0'
      units: MB
      master_item:
        key: kerio.api.master
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.statistics.storage.occupied.value
      tags:
      - tag: component
        value: storage
    - uuid: 2b9a03c817f142e286d53c93a8298175
      name: 'Kerio Connect: размер диска'
      type: DEPENDENT
      key: kerio.disk.total
      delay: '0'
      units: MB
      master_item:
        key: kerio.api.master
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.statistics.storage.total.value
      tags:
      - tag: component
        value: storage
    - uuid: 011a196ea05d4251a1451e675cce7d1a
      name: 'Kerio Connect: занято на диске, %'
      type: DEPENDENT
      key: kerio.disk.pct
      delay: '0'
      value_type: FLOAT
      units: '%'
      master_item:
        key: kerio.api.master
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.statistics.storage.percentage
      - type: REGEX
        parameters:
        - (\d+(?:\.\d+)?)
        - \1
      tags:
      - tag: component
        value: storage
      triggers:
      - uuid: b089dadc82e94e029386064331ca532f
        expression: last(/Kerio Connect by Script/kerio.disk.pct)>{$KERIO.DISK.HIGH} and last(/Kerio Connect by Script/kerio.disk.pct)<={$KERIO.DISK.DISASTER}
        name: 'Kerio Connect: диск занят больше чем на {$KERIO.DISK.HIGH}%'
        event_name: 'Kerio Connect на {HOST.NAME}: хранилище почты заняло {ITEM.LASTVALUE1} (> {$KERIO.DISK.HIGH}%)'
        priority: HIGH
        tags:
        - tag: scope
          value: capacity
        manual_close: 'YES'
        description: Хранилище почты заняло больше {$KERIO.DISK.HIGH}% диска (сейчас {ITEM.VALUE1}). До порога Disaster {$KERIO.DISK.DISASTER}% ещё есть запас, но скоро ящики перестанут принимать письма. Освободите место сразу.
        dependencies:
        - name: 'Kerio Connect: данные API не собираются'
          expression: nodata(/Kerio Connect by Script/kerio.api.master,5m)=1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Kerio Connect by Script/kerio.disk.pct)<={$KERIO.DISK.HIGH} or last(/Kerio Connect by Script/kerio.disk.pct)>{$KERIO.DISK.DISASTER}
      - uuid: e39af3fbb3fe438c92526d91984adc66
        expression: last(/Kerio Connect by Script/kerio.disk.pct)>{$KERIO.DISK.DISASTER}
        name: 'Kerio Connect: диск занят больше чем на {$KERIO.DISK.DISASTER}%'
        event_name: 'Kerio Connect на {HOST.NAME}: хранилище почты заняло {ITEM.LASTVALUE1} (> {$KERIO.DISK.DISASTER}%), сервер перестаёт принимать почту'
        priority: DISASTER
        tags:
        - tag: scope
          value: capacity
        manual_close: 'YES'
        description: Хранилище почты заняло больше {$KERIO.DISK.DISASTER}% диска (сейчас {ITEM.VALUE1}). На полном диске Kerio Connect не принимает письма. Освободите место немедленно.
        dependencies:
        - name: 'Kerio Connect: данные API не собираются'
          expression: nodata(/Kerio Connect by Script/kerio.api.master,5m)=1
    - uuid: d27d5bc1c9df493faac549e1da14f4af
      name: 'Kerio Connect: писем в очереди'
      type: DEPENDENT
      key: kerio.queue.total
      delay: '0'
      value_type: UNSIGNED
      master_item:
        key: kerio.api.master
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.statistics.storedInQueue.count
      tags:
      - tag: component
        value: queue
      triggers:
      - uuid: 777b9a9ad9c74d389f9fd2eb959d267a
        expression: last(/Kerio Connect by Script/kerio.queue.total)>{$KERIO.QUEUE.WARN}
        name: 'Kerio Connect: длинная очередь писем'
        event_name: 'Kerio Connect на {HOST.NAME}: в очереди {ITEM.LASTVALUE1} писем (> {$KERIO.QUEUE.WARN})'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        manual_close: 'YES'
        description: В очереди больше {$KERIO.QUEUE.WARN} писем (сейчас {ITEM.VALUE1}). Возможно, письма не доставляются или сбоит следующий сервер на пути.
        dependencies:
        - &id001
          name: 'Kerio Connect: данные API не собираются'
          expression: nodata(/Kerio Connect by Script/kerio.api.master,5m)=1
    - uuid: 825b03030e144d60a0adb4ff1f2584b0
      name: 'Kerio Connect: данные очереди'
      type: SCRIPT
      key: kerio.queue.raw
      delay: 1m
      history: 1h
      trends: '0'
      timeout: 30s
      value_type: TEXT
      description: 'Сводка по очереди из Queue.get (500 самых старых писем): oldest_age (с), stuck (статус 4.x.x старше {$KERIO.QUEUE.STUCK.AGE}), stuck_domains (сколько у этих писем разных доменов получателей). Адреса не возвращаются.

        '
      parameters:
      - name: host
        value: '{$KERIO.API.HOST}'
      - name: port
        value: '{$KERIO.API.PORT}'
      - name: scheme
        value: '{$KERIO.API.SCHEME}'
      - name: username
        value: '{$KERIO.API.USERNAME}'
      - name: password
        value: '{$KERIO.API.PASSWORD}'
      - name: stuck_age
        value: '{$KERIO.QUEUE.STUCK.AGE}'
      params: |
        // kerio_api.js - shared Kerio JSON-RPC client (Duktape engine). tools/sync_template_js.py
        // prepends it to every collector, because a Zabbix Script item cannot import code.
        var params = JSON.parse(value);
        var baseUrl = params.scheme + '://' + params.host + ':' + params.port + '/admin/api/jsonrpc/';
        var reqId = 0;
        var token = null;
        var cookie = null;

        function apiCall(method, callParams) {
            reqId++;
            var body = { jsonrpc: '2.0', id: reqId, method: method };
            if (callParams) body.params = callParams;
            if (token) body.token = token;

            var http = new HttpRequest();
            http.addHeader('Content-Type: application/json');
            http.addHeader('Accept: application/json');
            if (cookie) http.addHeader('Cookie: ' + cookie);
            if (token) http.addHeader('X-Token: ' + token);

            var resp = http.post(baseUrl, JSON.stringify(body));
            var status = http.getStatus();
            if (status < 200 || status >= 300) throw 'HTTP ' + status + ' on ' + method;

            var result = JSON.parse(resp);
            if (result.error) throw method + ' error: ' + result.error.message;
            if (method === 'Session.login') {
                var headers = http.getHeaders ? http.getHeaders() : {};
                var sc = headers['set-cookie'] || headers['Set-Cookie'] || '';
                if (sc) cookie = sc.split(';')[0];
            }
            return result.result;
        }

        // Several methods in one HTTP request: Kerio closes the connection after every
        // response, so each request pays the full connection setup.
        function batchCall(commands) {
            var results = apiCall('Batch.run', { commandList: commands });
            var out = [];
            for (var i = 0; i < commands.length; i++) {
                var r = results[i] || {};
                if (r.error) throw commands[i].method + ' error: ' + r.error.message;
                out.push(r.result || {});
            }
            return out;
        }

        function withSession(appName, body) {
            token = apiCall('Session.login', {
                userName: params.username,
                password: params.password,
                application: { name: appName, vendor: 'Zabbix', version: '7.0' }
            }).token;
            try {
                return body();
            } finally {
                try { apiCall('Session.logout'); } catch (e) {}
            }
        }

        // 'YYYY-MM-DD HH:MM[:SS]' or 'DD/Mon/YYYY HH:MM:SS' in server local time -> unix seconds.
        var MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        function serverTime(text, offsetMinutes) {
            var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::(\d{2}))?/.exec(text);
            var utc;
            if (m) utc = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
            else {
                m = /^(\d{2})\/(\w{3})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})/.exec(text);
                if (!m || !(m[2] in MONTHS)) return null;
                utc = Date.UTC(+m[3], MONTHS[m[2]], +m[1], +m[4], +m[5], +m[6]);
            }
            return utc / 1000 - offsetMinutes * 60;
        }

        // Zabbix time suffix ('90', '30m', '4h', '1d', '1w') -> seconds.
        function seconds(text) {
            var m = /^\s*(\d+)\s*([smhdw]?)\s*$/.exec(String(text));
            if (!m) throw 'bad time value: ' + text;
            return +m[1] * { '': 1, s: 1, m: 60, h: 3600, d: 86400, w: 604800 }[m[2]];
        }

        function recipientDomains(to) {
            var out = [];
            var parts = String(to || '').split(/[,;\s]+/);
            for (var i = 0; i < parts.length; i++) {
                var at = parts[i].lastIndexOf('@');
                if (at >= 0) out.push(parts[i].substr(at + 1).replace(/[<>]/g, '').toLowerCase());
            }
            return out;
        }

        function queueStats(list, now, offsetMinutes, stuckAge) {
            var oldest = 0, stuck = 0, domains = {};
            for (var i = 0; i < list.length; i++) {
                var created = serverTime(list[i].creationTime || '', offsetMinutes);
                if (created === null) continue;
                var age = Math.max(0, now - created);
                if (age > oldest) oldest = age;
                if (!/^4\./.test(list[i].status || '') || age <= stuckAge) continue;
                stuck++;
                var d = recipientDomains(list[i].to);
                for (var j = 0; j < d.length; j++) domains[d[j]] = true;
            }
            return { oldest_age: oldest, stuck: stuck, stuck_domains: Object.keys(domains).length };
        }

        return withSession('Zabbix Queue', function () {
            var r = batchCall([
                { method: 'Server.getServerTime', params: {} },
                // shortcut: the oldest 500 entries only, so stuck and stuck_domains undercount a longer queue; page through totalItems once several Queue.get in one Batch.run is verified live.
                { method: 'Queue.get', params: { query: { start: 0, limit: 500, orderBy: [{ columnName: 'creationTime', direction: 'Asc' }] } } }
            ]);
            return JSON.stringify(queueStats(r[1].list || [], r[0].info.currentTime, r[0].info.timezoneOffset, seconds(params.stuck_age)));
        });
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: 0399f47401d34c718b1f03b6c5cc9622
        expression: nodata(/Kerio Connect by Script/kerio.queue.raw,5m)=1
        name: 'Kerio Connect: данные очереди не собираются'
        event_name: 'Kerio Connect на {HOST.NAME}: данные очереди не собираются (нет данных 5 мин)'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
        manual_close: 'YES'
        description: Queue.get или Server.getServerTime 5 минут не возвращают данных. Проверьте роль пользователя API (Auditor достаточно).
        dependencies:
        - name: 'Kerio Connect: данные API не собираются'
          expression: nodata(/Kerio Connect by Script/kerio.api.master,5m)=1
    - uuid: 2f5030f023fc4019a7c8f3d2443d0419
      name: 'Kerio Connect: возраст самого старого письма в очереди'
      type: DEPENDENT
      key: kerio.queue.oldest.age
      delay: '0'
      value_type: UNSIGNED
      units: s
      master_item:
        key: kerio.queue.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.oldest_age
      tags:
      - tag: component
        value: queue
      triggers:
      - uuid: e05f1a70d485456084b47b95cf80b3c6
        expression: last(/Kerio Connect by Script/kerio.queue.oldest.age)>{$KERIO.QUEUE.AGE.HIGH}
        name: 'Kerio Connect: письмо в очереди дольше {$KERIO.QUEUE.AGE.HIGH}'
        event_name: 'Kerio Connect на {HOST.NAME}: самое старое письмо ждёт в очереди {ITEM.LASTVALUE1} (> {$KERIO.QUEUE.AGE.HIGH})'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        manual_close: 'YES'
        description: Хотя бы одно письмо ждёт дольше {$KERIO.QUEUE.AGE.HIGH}. Обычно не отвечает сервер получателя; проблема закроется, когда Kerio вернёт письмо отправителю. Посмотрите очередь в администрировании Kerio.
        dependencies:
        - name: 'Kerio Connect: данные API не собираются'
          expression: nodata(/Kerio Connect by Script/kerio.api.master,5m)=1
    - uuid: de7d5347a75540c39c13bfce811bdc12
      name: 'Kerio Connect: застрявшие письма в очереди'
      type: DEPENDENT
      key: kerio.queue.stuck
      delay: '0'
      value_type: UNSIGNED
      master_item:
        key: kerio.queue.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.stuck
      tags:
      - tag: component
        value: queue
    - uuid: 287f3c5fd5e14179adb759275c2b94e7
      name: 'Kerio Connect: домены получателей застрявших писем'
      type: DEPENDENT
      key: kerio.queue.stuck.domains
      delay: '0'
      value_type: UNSIGNED
      master_item:
        key: kerio.queue.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.stuck_domains
      tags:
      - tag: component
        value: queue
    - uuid: 1f0cf68cb77b4d86a08e08a3a3472fe9
      name: 'Kerio Connect: данные проверки релея'
      type: SCRIPT
      key: kerio.relay.unauth
      delay: 1h
      history: 1h
      trends: '0'
      timeout: 30s
      value_type: TEXT
      description: 'Считает строки Recv журнала mail за последний час, где Service SMTP, нет User (вход без авторизации), Sender-Host частный, а получатель внешний. Это признак NAT на пути к Kerio: из-за него группа Local clients становится открытым релеем. Возвращает count и truncated (хвост журнала короче часа), а также restricted (Smtp.get relayControl.isRestricted), group и group_entries (включённые записи IP-группы релея).

        '
      parameters:
      - name: host
        value: '{$KERIO.API.HOST}'
      - name: port
        value: '{$KERIO.API.PORT}'
      - name: scheme
        value: '{$KERIO.API.SCHEME}'
      - name: username
        value: '{$KERIO.API.USERNAME}'
      - name: password
        value: '{$KERIO.API.PASSWORD}'
      - name: lines
        value: '{$KERIO.LOG.LINES}'
      - name: allow
        value: '{$KERIO.RELAY.UNAUTH.ALLOW}'
      params: |
        // kerio_api.js - shared Kerio JSON-RPC client (Duktape engine). tools/sync_template_js.py
        // prepends it to every collector, because a Zabbix Script item cannot import code.
        var params = JSON.parse(value);
        var baseUrl = params.scheme + '://' + params.host + ':' + params.port + '/admin/api/jsonrpc/';
        var reqId = 0;
        var token = null;
        var cookie = null;

        function apiCall(method, callParams) {
            reqId++;
            var body = { jsonrpc: '2.0', id: reqId, method: method };
            if (callParams) body.params = callParams;
            if (token) body.token = token;

            var http = new HttpRequest();
            http.addHeader('Content-Type: application/json');
            http.addHeader('Accept: application/json');
            if (cookie) http.addHeader('Cookie: ' + cookie);
            if (token) http.addHeader('X-Token: ' + token);

            var resp = http.post(baseUrl, JSON.stringify(body));
            var status = http.getStatus();
            if (status < 200 || status >= 300) throw 'HTTP ' + status + ' on ' + method;

            var result = JSON.parse(resp);
            if (result.error) throw method + ' error: ' + result.error.message;
            if (method === 'Session.login') {
                var headers = http.getHeaders ? http.getHeaders() : {};
                var sc = headers['set-cookie'] || headers['Set-Cookie'] || '';
                if (sc) cookie = sc.split(';')[0];
            }
            return result.result;
        }

        // Several methods in one HTTP request: Kerio closes the connection after every
        // response, so each request pays the full connection setup.
        function batchCall(commands) {
            var results = apiCall('Batch.run', { commandList: commands });
            var out = [];
            for (var i = 0; i < commands.length; i++) {
                var r = results[i] || {};
                if (r.error) throw commands[i].method + ' error: ' + r.error.message;
                out.push(r.result || {});
            }
            return out;
        }

        function withSession(appName, body) {
            token = apiCall('Session.login', {
                userName: params.username,
                password: params.password,
                application: { name: appName, vendor: 'Zabbix', version: '7.0' }
            }).token;
            try {
                return body();
            } finally {
                try { apiCall('Session.logout'); } catch (e) {}
            }
        }

        // 'YYYY-MM-DD HH:MM[:SS]' or 'DD/Mon/YYYY HH:MM:SS' in server local time -> unix seconds.
        var MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        function serverTime(text, offsetMinutes) {
            var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::(\d{2}))?/.exec(text);
            var utc;
            if (m) utc = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
            else {
                m = /^(\d{2})\/(\w{3})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})/.exec(text);
                if (!m || !(m[2] in MONTHS)) return null;
                utc = Date.UTC(+m[3], MONTHS[m[2]], +m[1], +m[4], +m[5], +m[6]);
            }
            return utc / 1000 - offsetMinutes * 60;
        }

        // Zabbix time suffix ('90', '30m', '4h', '1d', '1w') -> seconds.
        function seconds(text) {
            var m = /^\s*(\d+)\s*([smhdw]?)\s*$/.exec(String(text));
            if (!m) throw 'bad time value: ' + text;
            return +m[1] * { '': 1, s: 1, m: 60, h: 3600, d: 86400, w: 604800 }[m[2]];
        }

        // Counts unauthenticated SMTP from private addresses to external recipients in the last hour of
        // the mail log: a sign of SNAT on the path to Kerio, which makes "Local clients" an open relay.
        var PRIVATE = /^(10(\.\d{1,3}){3}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2}|192\.168(\.\d{1,3}){2})$/;
        // Recv fields: Queue-ID, Service, From, To, Size, Sender-Host, [User], [SSL], [Subject], [Msg-Id].
        var SENDER = /, Size: \d+, Sender-Host: ([^,]+)(, User: [^,]*)?(?=, SSL: |, Subject: |, Msg-Id: |$)/g;
        var WINDOW = 3600; // equals the item delay (tests/test_templates.py): runs neither overlap nor leave gaps

        // From, To and Subject are sender-controlled and may imitate the Size/Sender-Host run, so every
        // candidate counts and recipients run up to the last one: an injected fake can widen the window and
        // raise a false alarm, but cannot hide the real sender or the real recipients.
        function unauthRelayHost(line, localDomains) {
            var i = line.indexOf('] Recv: ');
            if (i < 0) return null;
            var rest = line.substr(i + 8);
            if (!/^Queue-ID: \S+, Service: SMTP, From: /.test(rest)) return null;
            var to = rest.indexOf(', To: ');
            if (to < 0) return null;
            SENDER.lastIndex = 0;
            var m, last = -1, host = null;
            while ((m = SENDER.exec(rest)) !== null) {
                if (m.index > to) last = m.index;
                if (!m[2] && PRIVATE.test(m[1])) host = m[1];
            }
            if (host === null || last < 0) return null;
            var re = /@([^<>@\s,]+)>/g, d, external = false;
            var recipients = rest.substring(to, last);
            while ((d = re.exec(recipients)) !== null) {
                if (!localDomains[d[1].toLowerCase()]) external = true;
            }
            return external ? host : null;
        }

        // Enabled entries of the group Kerio relays for (Smtp.get relayControl), sorted: one value per
        // group content, so a change of the group is a change of the item.
        function relayGroupEntries(rows, groupId) {
            var out = [];
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                if (r.groupId !== groupId || !r.enabled) continue;
                out.push(r.type + ' ' + (r.type === 'Host' ? r.host : r.addr1 + '/' + r.addr2));
            }
            return out.sort();
        }

        function relayStats(lines, now, offsetMinutes, localDomains, allow, truncatable) {
            var since = now - WINDOW, count = 0, oldest = null;
            for (var i = 0; i < lines.length; i++) {
                var text = lines[i].content || '';
                var t = serverTime(text.substr(1), offsetMinutes);
                if (t === null) continue;
                if (oldest === null) oldest = t;
                if (t <= since) continue;
                var host = unauthRelayHost(text, localDomains);
                if (host !== null && !(allow && allow.test(host))) count++;
            }
            return { count: count, truncated: truncatable && oldest !== null && oldest > since ? 1 : 0 };
        }

        return withSession('Zabbix Relay', function () {
            var r = batchCall([
                { method: 'Server.getServerTime', params: {} },
                { method: 'Domains.get', params: { query: { fields: ['name'], start: 0, limit: 1000 } } },
                { method: 'Logs.get', params: { logName: 'mail', fromLine: 0, countLines: 1 } },
                { method: 'Smtp.get', params: {} },
                { method: 'IpAddressGroups.get', params: { query: { start: 0, limit: 5000 } } }
            ]);
            var relay = (r[3].server || r[3]).relayControl || {};
            var local = {}, domains = r[1].list || [];
            for (var i = 0; i < domains.length; i++) local[String(domains[i].name).toLowerCase()] = true;
            var limit = parseInt(params.lines, 10), total = r[2].totalItems || 0;
            var view = total ? apiCall('Logs.get', { logName: 'mail', fromLine: Math.max(0, total - limit), countLines: limit }).viewport || [] : [];
            // whole-address match: an unanchored '192.168.1.5' would also exempt .50-.59
            var allow = params.allow ? new RegExp('^(?:' + params.allow + ')$') : null;
            var out = relayStats(view, r[0].info.currentTime, r[0].info.timezoneOffset, local, allow, total > limit);
            out.restricted = relay.isRestricted ? 1 : 0;
            out.group = relay.ipAddressGroupName || '';
            out.group_entries = relay.isRestricted ? relayGroupEntries(r[4].list || [], relay.ipAddressGroupId) : [];
            return JSON.stringify(out);
        });
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: 8fc45610700d468295572222234d4b0b
        expression: nodata(/Kerio Connect by Script/kerio.relay.unauth,3h)=1
        name: 'Kerio Connect: данные проверки релея не собираются'
